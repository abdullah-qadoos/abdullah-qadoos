<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <radialGradient id="glowR" cx="82%" cy="45%" r="45%">
      <stop offset="0" stop-color="#ff1a1a" stop-opacity=".38"/>
      <stop offset=".5" stop-color="#8b0000" stop-opacity=".14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="5%" cy="100%" r="40%">
      <stop offset="0" stop-color="#ff1a1a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop offset="0" stop-color="#ff3030"/>
      <stop offset="1" stop-color="#b30000"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1a1a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff1a1a"/>
      <stop offset="1" stop-color="#ff1a1a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0a0a0c"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    
    <rect width="1200" height="320" fill="url(#glowL)"/>

    <!-- scanline -->
    <rect x="0" y="-60" width="1200" height="60" fill="#ff1a1a" opacity=".035">
      <animate attributeName="y" from="-60" to="320" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- left: terminal identity -->
    <g font-family="JetBrains Mono, SF Mono, Consolas, Menlo, monospace">
      <text x="80" y="92" font-size="18" fill="#ff3b3b">~/abdullah<tspan fill="#777"> $ </tspan><tspan fill="#ddd">whoami</tspan></text>
    </g>
    <text x="78" y="162" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="1.5" fill="#fff">MUHAMMAD <tspan fill="url(#red)">ABDULLAH</tspan></text>
