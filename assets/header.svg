<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <radialGradient id="glowR" cx="82%" cy="45%" r="45%">
      <stop offset="0" stop-color="#ff1a1a" stop-opacity=".38"/>
      <stop offset=".5" stop-color="#8b0000" stop-opacity=".14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="5%" cy="100%" r="40%">
      <stop offset="0" stop-color="#ff1a1a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop offset="0" stop-color="#ff3030"/>
      <stop offset="1" stop-color="#b30000"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1a1a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff1a1a"/>
      <stop offset="1" stop-color="#ff1a1a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0a0a0c"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowR)"/>
    <rect width="1200" height="320" fill="url(#glowL)"/>

    <!-- scanline -->
    <rect x="0" y="-60" width="1200" height="60" fill="#ff1a1a" opacity=".035">
      <animate attributeName="y" from="-60" to="320" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- left: terminal identity -->
    <g font-family="JetBrains Mono, SF Mono, Consolas, Menlo, monospace">
      <text x="80" y="92" font-size="18" fill="#ff3b3b">~/abdullah<tspan fill="#777"> $ </tspan><tspan fill="#ddd">whoami</tspan></text>
    </g>
    <text x="78" y="162" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="1.5" fill="#fff">MUHAMMAD <tspan fill="url(#red)">ABDULLAH</tspan></text>
    <rect x="80" y="184" width="0" height="4" rx="2" fill="url(#red)">
      <animate attributeName="width" from="0" to="96" dur="1.2s" fill="freeze"/>
    </rect>
    <g font-family="JetBrains Mono, SF Mono, Consolas, Menlo, monospace">
      <text x="80" y="228" font-size="21" fill="#cfcfcf">AI Engineer <tspan fill="#ff3b3b">//</tspan> AI Agents &amp; Automation</text>
      <rect x="518" y="211" width="11" height="22" fill="#ff1a1a">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/>
      </rect>
      <g font-size="13" fill="#ff5050">
        <rect x="80" y="252" width="150" height="28" rx="14" fill="#ff1a1a" fill-opacity=".08" stroke="#ff1a1a" stroke-opacity=".5"/>
        <text x="155" y="271" text-anchor="middle">multi-agent systems</text>
        <rect x="242" y="252" width="62" height="28" rx="14" fill="#ff1a1a" fill-opacity=".08" stroke="#ff1a1a" stroke-opacity=".5"/>
        <text x="273" y="271" text-anchor="middle">RAG</text>
        <rect x="316" y="252" width="128" height="28" rx="14" fill="#ff1a1a" fill-opacity=".08" stroke="#ff1a1a" stroke-opacity=".5"/>
        <text x="380" y="271" text-anchor="middle">workflow engines</text>
        <rect x="456" y="252" width="110" height="28" rx="14" fill="#ff1a1a" fill-opacity=".08" stroke="#ff1a1a" stroke-opacity=".5"/>
        <text x="511" y="271" text-anchor="middle">automation</text>
      </g>
    </g>

    <!-- right: agent mesh -->
    <g stroke="#ff1a1a" stroke-opacity=".35" stroke-width="1.5" fill="none">
      <path id="e1" d="M1000 160L890 90"/>
      <path id="e2" d="M1000 160L1110 85"/>
      <path id="e3" d="M1000 160L1130 200"/>
      <path id="e4" d="M1000 160L1040 265"/>
      <path id="e5" d="M1000 160L880 235"/>
      <path d="M890 90L1110 85M1110 85L1130 200M1130 200L1040 265M1040 265L880 235M880 235L890 90" stroke-opacity=".12" stroke-dasharray="4 6"/>
    </g>
    <!-- packets -->
    <g fill="#ff4d4d">
      <circle r="3.5"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
      <circle r="3.5"><animateMotion dur="2.8s" begin=".6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#e2"/></animateMotion></circle>
      <circle r="3.5"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
      <circle r="3.5"><animateMotion dur="2.6s" begin=".3s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#e4"/></animateMotion></circle>
      <circle r="3.5"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
    </g>
    <!-- agent nodes -->
    <g fill="#140405" stroke="#ff1a1a" stroke-width="2">
      <circle cx="890" cy="90" r="12"/>
      <circle cx="1110" cy="85" r="12"/>
      <circle cx="1130" cy="200" r="12"/>
      <circle cx="1040" cy="265" r="12"/>
      <circle cx="880" cy="235" r="12"/>
    </g>
    <g fill="#ff1a1a">
      <circle cx="890" cy="90" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="85" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2s" begin=".4s" repeatCount="indefinite"/></circle>
      <circle cx="1130" cy="200" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2s" begin=".8s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="265" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="235" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>
    <!-- hub -->
    <circle cx="1000" cy="160" r="34" fill="#ff1a1a" opacity=".5" filter="url(#blur)">
      <animate attributeName="r" values="30;40;30" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="160" r="26" fill="#1a0506" stroke="url(#red)" stroke-width="3"/>
    <text x="1000" y="167" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700" fill="#ff3b3b">AI</text>

    <!-- bottom accent -->
    <rect x="0" y="316" width="1200" height="4" fill="url(#line)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="18" fill="none" stroke="#ff1a1a" stroke-opacity=".25"/>
</svg>
